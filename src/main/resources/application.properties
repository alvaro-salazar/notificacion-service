spring.application.name=notificacion-service
server.port=${SERVER_PORT:8086}

management.server.port=${MANAGEMENT_PORT:8087}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Base de datos ────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/notificaciondb}
spring.datasource.username=${DB_USER:notificacion}
spring.datasource.password=${DB_PASS:notif123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Kafka ───────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer -- usa String deserializer; la deserializacion es manual con Jackson
spring.kafka.consumer.group-id=notificacion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Exactly-once: solo leer mensajes confirmados por la transaccion Kafka del producer
spring.kafka.consumer.properties.isolation.level=read_committed

# Producer -- necesario para que DeadLetterPublishingRecoverer pueda publicar en el DLT
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ── Email (MailHog local / SendGrid produccion) ─────────────────────────────
# MailHog no requiere autenticacion; en produccion configurar usuario/password
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Remitente que aparece en todos los emails de La Fogata Digital
notificacion.mail.from=${MAIL_FROM:noreply@fogatadigital.com}

# ── Twilio (SMS) ─────────────────────────────────────────────────────────────
# Obtener credenciales en: https://console.twilio.com
# +15005550006 es el numero magico de pruebas de Twilio (siempre tiene exito en modo test)
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACtest00000000000000000000000000000}
twilio.auth-token=${TWILIO_AUTH_TOKEN:test00000000000000000000000000000}
twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}
